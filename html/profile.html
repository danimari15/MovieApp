<!doctype html>
<html lang="it">
  <!-- head profilo -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie App - Account</title>
<link rel="icon" type="image/png" href="../img/logo-nero.png" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <!-- body -->
  <body class="profile-body">
    <!-- header -->
    <header class="main-header">
      <!-- logo -->
      <div>
        <a href="./home.html">
          <img
            src="../img/logo-nero.png"
            class="logo-img"
            alt="Movie-App Logo"
          />
        </a>
      </div>
      <!-- nav -->
      <nav class="navigation-bar">
        <a href="./home.html" class="nav-link">Home</a>
        <a href="./movies.html" class="nav-link">Film</a>
        <a href="./series.html" class="nav-link">Serie TV</a>
        <a href="./profile.html" class="nav-link active">Account</a>
      </nav>
    </header>
    <!-- main con sezione profilo -->
    <main class="content-wrapper">
      <div class="user-profile-box">
        <!-- avatar -->
        <!-- Aggiungi questo div attorno alla tua immagine -->
        <div class="rampa-di-lancio">
          <div class="avatar-circle">DM</div>
        </div>
        <h2 class="user-title">Daniele Marinelli</h2>
        <p class="project-details">
          Esame di
          <a
            href="https://www.google.com/search?q=Frontend"
            target="_blank"
            class="tech-link"
            >Frontend</a
          >.
        </p>
        <!-- tecnologie utilizzate -->
        <p class="tech-stack">
          Tecnologie utilizzate:
          <a
            href="https://developer.mozilla.org/en-US/docs/Web/JavaScript"
            target="_blank"
            class="tech-link"
            >JavaScript</a
          >,
          <a
            href="https://developer.mozilla.org/en-US/docs/Web/CSS"
            target="_blank"
            class="tech-link"
            >CSS</a
          >
          e integrazione dati
          <a
            href="https://www.themoviedb.org/documentation/api"
            target="_blank"
            class="tech-link"
            >TMDB API</a
          >.
        </p>
        <!-- btn GitHub -->
        <div class="git-action">
          <a
            href="https://github.com/Dani-vsc/movieapp-marinelli"
            target="_blank"
            class="btn-git"
            >Repository GitHub esame</a
          >
        </div>
      </div>
    </main>
    <!-- footer -->
    <footer class="app-footer">
      <span class="footer-text">Movie App &copy; 2026</span>
    </footer>
    <script>
      const rampa = document.querySelector(".rampa-di-lancio");
      const audioVader = new Audio("../mp3/vader.mp3");
      audioVader.volume = 0.8;

      // Sblocco audio al primo click (necessario per i browser moderni)
      document.addEventListener(
        "click",
        () => {
          audioVader.load();
        },
        { once: true },
      );

      let timerAudio;
      // Non serve più latoOscuroSbloccato se vogliamo che riparta ogni volta

      rampa.addEventListener("mouseenter", () => {
        // Timer che fa partire l'audio a 5 secondi
        timerAudio = setTimeout(() => {
          audioVader
            .play()
            .catch((e) =>
              console.log("Audio bloccato: clicca sulla pagina per sbloccarlo"),
            );
        }, 5000);
      });

      rampa.addEventListener("mouseleave", () => {
        // 1. Ferma il timer del decollo (se non sono passati 5 secondi)
        clearTimeout(timerAudio);

        // 2. STOP e RESET dell'audio (se era già partito)
        audioVader.pause();
        audioVader.currentTime = 0;
      });
    </script>
  </body>
</html>
